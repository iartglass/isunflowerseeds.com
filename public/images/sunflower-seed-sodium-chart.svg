<text x="30" y="336" style="font-family:Arial,Helvetica,sans-serif" font-size="12" fill="#666">Source: USDA FoodData Central (FDC IDs 170562, 170563, 168593, 168594, 169418) scaled to 28 g. Calculated by XingYi Trading.</text></svg>