<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d">
  <title id="t">Four-step bulk sunflower seed order process</title>
  <desc id="d">Step 1 request a quote, step 2 review samples, step 3 confirm order terms, step 4 production and shipment.</desc>
  <rect width="960" height="300" fill="#faf9f7"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g>
      <rect x="30" y="70" width="195" height="160" rx="12" fill="#ffffff" stroke="#b8860b" stroke-width="2"/>
      <circle cx="127" cy="70" r="22" fill="#b8860b"/><text x="127" y="78" font-size="22" font-weight="700" fill="#ffffff">1</text>
      <text x="127" y="140" font-size="19" font-weight="700" fill="#1e3a5f">Request a Quote</text>
      <text x="127" y="170" font-size="14" fill="#444">Series, volume, bags,</text>
      <text x="127" y="190" font-size="14" fill="#444">Incoterm, port</text>
    </g>
    <g>
      <rect x="260" y="70" width="195" height="160" rx="12" fill="#ffffff" stroke="#b8860b" stroke-width="2"/>
      <circle cx="357" cy="70" r="22" fill="#b8860b"/><text x="357" y="78" font-size="22" font-weight="700" fill="#ffffff">2</text>
      <text x="357" y="140" font-size="19" font-weight="700" fill="#1e3a5f">Review Samples</text>
      <text x="357" y="170" font-size="14" fill="#444">Check size, grade</text>
      <text x="357" y="190" font-size="14" fill="#444">and appearance</text>
    </g>
    <g>
      <rect x="490" y="70" width="195" height="160" rx="12" fill="#ffffff" stroke="#b8860b" stroke-width="2"/>
      <circle cx="587" cy="70" r="22" fill="#b8860b"/><text x="587" y="78" font-size="22" font-weight="700" fill="#ffffff">3</text>
      <text x="587" y="140" font-size="19" font-weight="700" fill="#1e3a5f">Confirm Order Terms</text>
      <text x="587" y="170" font-size="14" fill="#444">Price, payment,</text>
      <text x="587" y="190" font-size="14" fill="#444">documents in writing</text>
    </g>
    <g>
      <rect x="720" y="70" width="195" height="160" rx="12" fill="#ffffff" stroke="#b8860b" stroke-width="2"/>
      <circle cx="817" cy="70" r="22" fill="#b8860b"/><text x="817" y="78" font-size="22" font-weight="700" fill="#ffffff">4</text>
      <text x="817" y="140" font-size="19" font-weight="700" fill="#1e3a5f">Production &amp; Shipment</text>
      <text x="817" y="170" font-size="14" fill="#444">Grading, packing,</text>
      <text x="817" y="190" font-size="14" fill="#444">loading, export</text>
    </g>
    <g stroke="#1e3a5f" stroke-width="3" fill="none">
      <path d="M227 150 H258"/><path d="M457 150 H488"/><path d="M687 150 H718"/>
    </g>
    <g fill="#1e3a5f"><path d="M258 143 l10 7 -10 7z"/><path d="M488 143 l10 7 -10 7z"/><path d="M718 143 l10 7 -10 7z"/></g>
  </g>
</svg>
