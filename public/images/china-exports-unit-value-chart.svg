<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 402" role="img" aria-labelledby="t d">
<title id="t">Average export value per tonne, US dollars</title><desc id="d">Bar chart of China's average HS 1206 export value per tonne, rising from 1,293 dollars in 2019 to 1,706 dollars in 2024.</desc>
<rect width="960" height="402" fill="#faf9f7"/>
<text x="30" y="38" style="font-family:Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#1e3a5f">Average export value per tonne, US dollars</text>
<text x="30" y="91" style="font-family:Arial,Helvetica,sans-serif" font-size="15" fill="#333">2019</text>
<rect x="120" y="70" width="401" height="30" rx="4" fill="#1e3a5f"/>
<text x="531" y="91" style="font-family:Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#1e3a5f">1,293 $/t</text>
<text x="30" y="143" style="font-family:Arial,Helvetica,sans-serif" font-size="15" fill="#333">2020</text>
<rect x="120" y="122" width="395" height="30" rx="4" fill="#1e3a5f"/>
<text x="525" y="143" style="font-family:Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#1e3a5f">1,275 $/t</text>
<text x="30" y="195" style="font-family:Arial,Helvetica,sans-serif" font-size="15" fill="#333">2021</text>
<rect x="120" y="174" width="426" height="30" rx="4" fill="#1e3a5f"/>
<text x="556" y="195" style="font-family:Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#1e3a5f">1,373 $/t</text>
<text x="30" y="247" style="font-family:Arial,Helvetica,sans-serif" font-size="15" fill="#333">2022</text>
<rect x="120" y="226" width="473" height="30" rx="4" fill="#1e3a5f"/>
<text x="603" y="247" style="font-family:Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#1e3a5f">1,527 $/t</text>
<text x="30" y="299" style="font-family:Arial,Helvetica,sans-serif" font-size="15" fill="#333">2023</text>
<rect x="120" y="278" width="554" height="30" rx="4" fill="#1e3a5f"/>
<text x="684" y="299" style="font-family:Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#1e3a5f">1,789 $/t</text>
<text x="30" y="351" style="font-family:Arial,Helvetica,sans-serif" font-size="15" fill="#333">2024</text>
<rect x="120" y="330" width="529" height="30" rx="4" fill="#1e3a5f"/>
<text x="659" y="351" style="font-family:Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#1e3a5f">1,706 $/t</text>
<text x="30" y="388" style="font-family:Arial,Helvetica,sans-serif" font-size="12" fill="#666">Source: UN Comtrade, HS 1206. Average customs value of all sunflower seed exports, not a price quotation.</text></svg>