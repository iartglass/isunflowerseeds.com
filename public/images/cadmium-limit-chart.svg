<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 194" role="img" aria-labelledby="t d">
<title id="t">Cadmium in sunflower seed: sample mean vs EU limit</title><desc id="d">Bar chart: a Finnish compilation lists a mean cadmium level of 0.46 mg per kg for sunflower seed, against an EU maximum level of 0.50 mg per kg.</desc>
<rect width="960" height="194" fill="#faf9f7"/>
<text x="30" y="38" style="font-family:Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#1e3a5f">Cadmium in sunflower seed: sample mean vs EU limit</text>
<text x="30" y="91" style="font-family:Arial,Helvetica,sans-serif" font-size="15" fill="#333">Finnish sample mean</text>
<rect x="260" y="70" width="399" height="30" rx="4" fill="#d4740e"/>
<text x="669" y="91" style="font-family:Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#1e3a5f">0.46 mg/kg</text>
<text x="30" y="143" style="font-family:Arial,Helvetica,sans-serif" font-size="15" fill="#333">EU maximum level</text>
<rect x="260" y="122" width="433" height="30" rx="4" fill="#1e3a5f"/>
<text x="703" y="143" style="font-family:Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#1e3a5f">0.50 mg/kg</text>
<text x="30" y="180" style="font-family:Arial,Helvetica,sans-serif" font-size="12" fill="#666">Source: EFSA-hosted cadmium table citing Regulation (EC) No 1881/2006 and Kymäläinen & Sjöberg (2006). Check the current EU text.</text></svg>